[package]
name = "ghidra-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ghidra-rs"
path = "src/main.rs"

[dependencies]
ghidra-abi = { path = "../ghidra-abi" }
ghidra-analysis = { path = "../ghidra-analysis" }
ghidra-cfg = { path = "../ghidra-cfg" }
ghidra-graph = { path = "../ghidra-graph" }
ghidra-ssa = { path = "../ghidra-ssa" }
ghidra-core = { path = "../ghidra-core" }
ghidra-project = { path = "../ghidra-project" }
ghidra-pcode = { path = "../ghidra-pcode" }
ghidra-sleigh = { path = "../ghidra-sleigh" }
ghidra-languages = { path = "../ghidra-languages" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

