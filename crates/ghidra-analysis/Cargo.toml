[package]
name = "ghidra-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native P-code storage and dataflow analysis foundations"
publish = false

[dependencies]
ghidra-cfg = { path = "../ghidra-cfg" }
ghidra-graph = { path = "../ghidra-graph" }
ghidra-pcode = { path = "../ghidra-pcode" }
ghidra-ssa = { path = "../ghidra-ssa" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
