[package]
name = "ghidra-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Java-free binary loading and x86 analysis for the Rust Ghidra port"
license = "Apache-2.0"
publish = false

[dependencies]
object = { version = "0.37", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

