name: Rust desktop

on:
  push:
    branches: [rust-desktop]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - examples/**
      - scripts/Enter-NativeBuild.ps1
      - .github/workflows/rust-desktop.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/**
      - examples/**
      - scripts/Enter-NativeBuild.ps1
      - .github/workflows/rust-desktop.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Initialize Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/Enter-NativeBuild.ps1
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Test library documentation examples
        run: cargo test --locked --workspace --doc
      - name: Execute P-code example without a desktop
        run: cargo run --locked -p ghidra-desktop -- --run-pcode examples/pcode/sum-loop.json
      - name: Analyze P-code aliases and SSA without a desktop
        run: cargo run --locked -p ghidra-desktop -- --analyze-pcode examples/pcode/alias-branch.json --instruction-uniques
      - name: Compile and lift retained processor sources
        run: cargo test --locked -p ghidra-sleigh --test upstream_specs -- --ignored --test-threads=1
      - name: Verify Thumb IT context during desktop stepping
        run: cargo test --locked -p ghidra-desktop upstream_thumb_it -- --ignored
      - name: Lift and analyze a recovered binary function
        run: cargo test --locked -p ghidra-desktop upstream_x86_function -- --ignored
      - name: Build native release
        run: cargo build --locked --release -p ghidra-desktop
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-rs-${{ runner.os }}-${{ runner.arch }}
          path: target/release/ghidra-rs.exe
          if-no-files-found: error
      - name: Upload Unix executable
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-rs-${{ runner.os }}-${{ runner.arch }}
          path: target/release/ghidra-rs
          if-no-files-found: error
