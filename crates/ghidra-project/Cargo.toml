[package]
name = "ghidra-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable Java-free project persistence for the Rust Ghidra desktop"
publish = false

[dependencies]
ghidra-core = { path = "../ghidra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
